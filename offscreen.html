<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screen Distance Reminder — offscreen worker</title>
</head>
<body>
  <!-- This page is never shown to the user. It exists only because MV3
       service workers can't access getUserMedia or the DOM, so camera
       access + face detection has to happen somewhere with a document. -->
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="canvas" style="display:none"></canvas>
  <script src="offscreen.js"></script>
</body>
</html>
