<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screen Distance Reminder — monitoring</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; }
    .wrap { width: 300px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="dot" id="statusDot"></span>
      <h1>Monitoring</h1>
    </header>
    <p class="lede" id="statusText">Starting up…</p>
    <button id="grantBtn" class="primary" style="display:none">Grant camera access</button>
  </div>

  <!-- Never shown to the user, just needed to hold the live camera stream. -->
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="canvas" style="display:none"></canvas>

  <script src="lib/face-api.min.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
